<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MoGe depth-parallax prototype — Kambri Lawn</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
  #canvas-host { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; }
  #hud {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(0,0,0,0.65); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; line-height: 1.5; max-width: 360px;
  }
  #hud b { color: #ffd27f; }
  #hud .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  button {
    background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 5px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  button.active { background: #ffd27f; color: #222; border-color: #ffd27f; }
  #anchor-readout { position: absolute; bottom: 12px; left: 12px; z-index: 10;
    background: rgba(0,0,0,0.65); padding: 8px 12px; border-radius: 8px;
    font-size: 11px; font-family: ui-monospace, monospace; white-space: pre;
  }
</style>
</head>
<body>
<div id="canvas-host">
  <div id="hud">
    <div><b>MoGe-2 depth parallax</b> — Kambri Lawn (isolated prototype)</div>
    <div>Move the pointer to look around. This is a real displaced 3D mesh, not a 2-layer fake.</div>
    <div class="row">
      <button id="btn-depth" class="active">Depth parallax</button>
      <button id="btn-flat">Flat (current prod behaviour)</button>
      <button id="btn-wire">Toggle wireframe</button>
    </div>
    <div class="row">FPS: <span id="fps">—</span> &nbsp; Mesh: <span id="meshinfo">—</span></div>
  </div>
  <div id="anchor-readout"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

const host = document.getElementById("canvas-host");
const fpsEl = document.getElementById("fps");
const meshInfoEl = document.getElementById("meshinfo");
const anchorEl = document.getElementById("anchor-readout");

// --- Load the real MoGe point-map geometry (binary: u32 gw, u32 gh, then
// gw*gh*3 float32 XYZ in MoGe's OpenCV camera coordinates: X right, Y down,
// Z forward). three.js is Y-up, so Y is negated on load — otherwise the
// whole relief renders upside down (sky pushed "down", ground pushed "up"),
// which is what produced the giant inverted spikes in the first render.
async function loadPoints() {
  const buf = await (await fetch("assets/points.bin")).arrayBuffer();
  const header = new Uint32Array(buf, 0, 2);
  const gw = header[0], gh = header[1];
  const raw = new Float32Array(buf, 8);
  const positions = new Float32Array(raw.length);
  for (let i = 0; i < raw.length; i += 3) {
    positions[i] = raw[i];
    positions[i + 1] = -raw[i + 1]; // OpenCV Y-down -> three.js Y-up
    positions[i + 2] = raw[i + 2];
  }
  return { gw, gh, positions };
}

const { gw, gh, positions } = await loadPoints();
meshInfoEl.textContent = `${gw}x${gh} grid, ${(gw - 1) * (gh - 1) * 2} tris`;

// Depth-continuity cull: a regular grid triangulates straight across every
// silhouette edge (branch against sky, pole against lawn), bridging near and
// far depth into one long stretched triangle. Drop any triangle whose three
// vertices don't agree on depth within a tolerance — this is the standard
// mitigation for exactly the "stretched-edge artefact" MoGe's own repanner
// avoids with proper meshing; this prototype does it directly on the index
// buffer so it's visible and easy to tune.
function buildCulledIndices(gw, gh, positions, depthTolerance) {
  const indices = [];
  const zAt = (x, y) => positions[(y * gw + x) * 3 + 2];
  for (let y = 0; y < gh - 1; y++) {
    for (let x = 0; x < gw - 1; x++) {
      const i00 = y * gw + x, i10 = i00 + 1, i01 = i00 + gw, i11 = i01 + 1;
      const z00 = zAt(x, y), z10 = zAt(x + 1, y), z01 = zAt(x, y + 1), z11 = zAt(x + 1, y + 1);
      const coherent = (a, b, c) => {
        const zs = [a, b, c];
        return Math.max(...zs) - Math.min(...zs) < depthTolerance * Math.max(...zs);
      };
      if (coherent(z00, z10, z11)) indices.push(i00, i10, i11);
      if (coherent(z00, z11, z01)) indices.push(i00, i11, i01);
    }
  }
  return indices;
}
const culledIndices = buildCulledIndices(gw, gh, positions, 0.04);
const culledFraction = 1 - culledIndices.length / 3 / ((gw - 1) * (gh - 1) * 2);
meshInfoEl.textContent = `${gw}x${gh} grid, ${culledIndices.length / 3} tris (${(culledFraction * 100).toFixed(0)}% culled at edges)`;

// Five production-realistic anchor points (same normalized x,y used for
// traces in server/src/scenes.js's {x,y} anchoring — picked here to land
// inside the sharp photo region, at a spread of real depths; see README).
const ANCHORS = [
  { label: "near-left",  nx: 0.15, ny: 0.55 },
  { label: "near-mid",   nx: 0.35, ny: 0.75 },
  { label: "far-sky",    nx: 0.55, ny: 0.35 },
  { label: "mid-right",  nx: 0.75, ny: 0.65 },
  { label: "near-right", nx: 0.90, ny: 0.80 },
];

function sampleGridPosition(nx, ny) {
  // Bilinear sample of the grid vertex buffer at normalized (nx, ny).
  const gx = nx * (gw - 1);
  const gy = ny * (gh - 1);
  const x0 = Math.floor(gx), y0 = Math.floor(gy);
  const x1 = Math.min(x0 + 1, gw - 1), y1 = Math.min(y0 + 1, gh - 1);
  const fx = gx - x0, fy = gy - y0;
  const at = (x, y) => {
    const i = (y * gw + x) * 3;
    return [positions[i], positions[i + 1], positions[i + 2]];
  };
  const p00 = at(x0, y0), p10 = at(x1, y0), p01 = at(x0, y1), p11 = at(x1, y1);
  const lerp3 = (a, b, t) => [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, a[2] + (b[2]-a[2])*t];
  const top = lerp3(p00, p10, fx);
  const bot = lerp3(p01, p11, fx);
  return lerp3(top, bot, fy);
}

// --- Three.js scene ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 500);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
host.appendChild(renderer.domElement);

// PlaneGeometry gives us the UV layout and row-major vertex order for free;
// we only replace its position attribute and index buffer with the real
// depth geometry and the edge-culled triangle list.
const geometry = new THREE.PlaneGeometry(1, 1, gw - 1, gh - 1);
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
geometry.setIndex(culledIndices);
geometry.computeVertexNormals();

const texLoader = new THREE.TextureLoader();
const colorTex = await texLoader.loadAsync("assets/color.jpg");
colorTex.colorSpace = THREE.SRGBColorSpace;

const material = new THREE.MeshBasicMaterial({ map: colorTex, side: THREE.DoubleSide });
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

const wireMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: true });
let wireframeOn = false;

// Camera framing: MoGe reconstructs points in the ORIGINAL photographing
// camera's own coordinate frame, which sits at (0,0,0) looking down +Z —
// that's the physically correct vantage point to render from, not some
// fraction of the mesh's bounding box (placing the camera near box.min.z put
// it almost inside the nearest geometry, which is what produced the
// grossly exaggerated stretching in the first attempt, on top of the
// Y-flip bug). A "window" parallax model — translate the camera parallel to
// the image plane without rotating it — is what a real head-tracked/motion
// parallax display does, and it keeps straight lines in the photo looking
// straight as you move, unlike orbiting the camera around the scene.
const box = new THREE.Box3().setFromBufferAttribute(geometry.attributes.position);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());
console.log("mesh bounds", box.min, box.max, "center", center, "size", size);

const baseCamPos = new THREE.Vector3(0, 0, 0);
camera.position.copy(baseCamPos);
camera.lookAt(0, 0, 1);

const PARALLAX_STRENGTH = 2.2; // metres of lateral camera travel at full pointer deflection

let mode = "depth"; // "depth" | "flat"
let pointerX = 0.5, pointerY = 0.5; // normalized, 0..1

host.addEventListener("pointermove", (e) => {
  pointerX = e.clientX / window.innerWidth;
  pointerY = e.clientY / window.innerHeight;
});

document.getElementById("btn-depth").addEventListener("click", (e) => {
  mode = "depth";
  document.getElementById("btn-depth").classList.add("active");
  document.getElementById("btn-flat").classList.remove("active");
});
document.getElementById("btn-flat").addEventListener("click", (e) => {
  mode = "flat";
  document.getElementById("btn-flat").classList.add("active");
  document.getElementById("btn-depth").classList.remove("active");
});
document.getElementById("btn-wire").addEventListener("click", () => {
  wireframeOn = !wireframeOn;
  mesh.material = wireframeOn ? wireMat : material;
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Anchor markers: real HTML overlay reprojected through the camera each
// frame, so their screen position tests the SAME projection the mesh uses.
// This is the "stability of spatially anchored traces" check.
const anchorDivs = ANCHORS.map((a) => {
  const el = document.createElement("div");
  el.style.cssText = "position:absolute;width:14px;height:14px;border-radius:50%;background:#ff5a36;border:2px solid #fff;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 6px rgba(0,0,0,0.6);z-index:5;";
  host.appendChild(el);
  const worldPos = new THREE.Vector3(...sampleGridPosition(a.nx, a.ny));
  return { ...a, el, worldPos };
});

let frameCount = 0, lastFpsTime = performance.now(), fps = 0;

function animate() {
  requestAnimationFrame(animate);

  const dx = (pointerX - 0.5) * 2; // -1..1
  const dy = (pointerY - 0.5) * 2;

  if (mode === "depth") {
    // Pure lateral translation, orientation fixed looking down +Z — the
    // "window" model. No re-aiming at `center`: that would rotate the
    // camera as the pointer moves, which bends straight lines in the photo
    // and isn't how real parallax from head movement looks.
    camera.position.set(
      baseCamPos.x + dx * PARALLAX_STRENGTH,
      baseCamPos.y - dy * PARALLAX_STRENGTH * 0.5,
      baseCamPos.z,
    );
    camera.lookAt(camera.position.x, camera.position.y, camera.position.z + 1);
  } else {
    // "flat" mode: no camera movement at all — reproduces the current
    // production behaviour (a static image, panned by translating it in
    // CSS, which has zero depth parallax) as the comparison baseline.
    camera.position.copy(baseCamPos);
    camera.lookAt(center.x, center.y, center.z);
  }

  renderer.render(scene, camera);

  // Reproject anchors to screen space every frame.
  const readoutLines = [];
  for (const a of anchorDivs) {
    const p = a.worldPos.clone().project(camera);
    const sx = (p.x * 0.5 + 0.5) * window.innerWidth;
    const sy = (-p.y * 0.5 + 0.5) * window.innerHeight;
    a.el.style.left = `${sx}px`;
    a.el.style.top = `${sy}px`;
    a.el.style.display = p.z > 1 ? "none" : "block";
    readoutLines.push(`${a.label.padEnd(10)} screen=(${sx.toFixed(0)},${sy.toFixed(0)})`);
  }
  anchorEl.textContent = `mode=${mode}  pointer=(${pointerX.toFixed(2)},${pointerY.toFixed(2)})\n` + readoutLines.join("\n");

  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime > 500) {
    fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
    fpsEl.textContent = fps;
    frameCount = 0;
    lastFpsTime = now;
  }
}
animate();
</script>
</body>
</html>
