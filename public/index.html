<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Cursed Museum</title>
    <meta
      name="description"
      content="A shared, explorable gothic museum of haunted objects and unreliable histories. Move with WASD, press V to switch views, E to inspect."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="app-page">
    <div id="viewport" class="viewport" tabindex="0" role="application"
      aria-label="The Cursed Museum. Move with WASD or arrow keys, press V to switch between overhead and first-person view, E or click to inspect an exhibit.">
      <canvas id="scene-canvas"></canvas>

      <!-- Everything below floats above the full-bleed 3D canvas. -->
      <header class="topbar">
        <div class="topbar-text">
          <h1>The Cursed Museum</h1>
          <p class="presence" id="presence" aria-live="polite"></p>
          <p class="whoami" id="whoami"></p>
        </div>
        <a class="about-link" href="/readme/">What is this?</a>
      </header>

      <div class="crosshair" id="crosshair" aria-hidden="true"></div>

      <!-- A short-lived callout the first time first-person mouse-look
           actually engages, so the two-state control model (locked
           exploration vs. free cursor) is discoverable without a manual. -->
      <div class="lock-hint" id="lock-hint" hidden>Press Esc anytime to free your cursor</div>

      <footer class="bottom-bar">
        <div class="scene-caption">
          <h2 id="gallery-title">Entrance Hall</h2>
          <p id="gallery-hint">&nbsp;</p>
        </div>
        <p class="hint" id="control-hint">
          WASD/arrows to move &middot; V to switch view &middot; E or click to inspect
        </p>
      </footer>

      <!-- Name-entry gate, shown until a display name is chosen. -->
      <div id="name-gate" class="overlay-gate" hidden>
        <form id="name-form" class="gate-card">
          <h2>Welcome to The Cursed Museum</h2>
          <p>Every object has a story. None of them can be trusted.</p>
          <label for="name-input">What shall the archive call you?</label>
          <input id="name-input" name="name" maxlength="40" autocomplete="off" required
            placeholder="e.g. The Quiet Curator" />
          <button type="submit">Enter the museum</button>
        </form>
      </div>

      <!-- Donor counter prompt, shown on approach in the hall. -->
      <button id="donate-hint" class="floating-hint" type="button" hidden>
        Press E to donate a relic
      </button>

      <!-- Touch fallback: on-screen movement + interact, shown only on
           touch-capable devices (no keyboard to rely on). -->
      <div id="touch-controls" class="touch-controls" hidden>
        <div class="dpad" aria-label="Move">
          <button type="button" data-dir="up" aria-label="Move forward">&#9650;</button>
          <button type="button" data-dir="left" aria-label="Move left">&#9664;</button>
          <button type="button" data-dir="down" aria-label="Move back">&#9660;</button>
          <button type="button" data-dir="right" aria-label="Move right">&#9654;</button>
        </div>
        <button type="button" id="touch-interact" class="touch-interact" aria-label="Inspect nearest exhibit">E</button>
        <button type="button" id="touch-view" class="touch-view" aria-label="Switch view">V</button>
      </div>

      <!-- Donation form overlay. -->
      <div id="donate-gate" class="overlay-gate" hidden>
        <form id="donate-form" class="gate-card dossier-card">
          <h2>Donate a Relic</h2>
          <label for="donate-gallery">Gallery</label>
          <select id="donate-gallery" name="galleryId" required></select>

          <label for="donate-slot">Display slot</label>
          <select id="donate-slot" name="slotId" required></select>

          <label for="donate-title">Title</label>
          <input id="donate-title" name="title" maxlength="80" required placeholder="The Spoon That Remembers" />

          <label for="donate-claim">One-sentence origin claim</label>
          <textarea id="donate-claim" name="originClaim" maxlength="240" required rows="2"
            placeholder="An ordinary silver spoon that remembers every secret told during dinner."></textarea>

          <label for="donate-donor">Donor name</label>
          <input id="donate-donor" name="donorName" maxlength="40" required placeholder="Anonymous Curator" />

          <div class="gate-actions">
            <button type="button" id="donate-cancel" class="secondary">Esc &middot; Cancel</button>
            <button type="submit">Donate</button>
          </div>
          <p class="gate-error" id="donate-error" role="alert"></p>
        </form>
      </div>

      <!-- Exhibit dossier overlay. -->
      <div id="dossier" class="overlay-gate" hidden>
        <div class="gate-card dossier-card" role="dialog" aria-labelledby="dossier-title">
          <button type="button" id="dossier-close" class="dossier-close" aria-label="Close dossier (Esc)">&times;</button>
          <p class="dossier-kicker" id="dossier-kicker"></p>
          <h2 id="dossier-title"></h2>
          <p class="dossier-meta" id="dossier-meta"></p>
          <div id="dossier-accounts" class="dossier-accounts"></div>

          <form id="account-form" class="account-form">
            <h3 id="account-form-title">Add Counter-Evidence</h3>
            <input type="hidden" id="account-challenged" value="" />
            <label for="account-kind">This account is a&hellip;</label>
            <select id="account-kind" name="kind">
              <option value="testimony">New Testimony</option>
              <option value="contradiction">Contradiction</option>
              <option value="revision">Proposed Revision</option>
              <option value="counter-evidence">Counter-Evidence</option>
            </select>
            <label for="account-body">Your account</label>
            <textarea id="account-body" name="body" maxlength="600" rows="3" required
              placeholder="Manufacturing records identify a later origin&hellip;"></textarea>
            <label for="account-author">Your name</label>
            <input id="account-author" name="authorName" maxlength="40" placeholder="Anonymous Curator" />
            <div class="gate-actions">
              <button type="button" id="account-cancel" class="secondary">Cancel</button>
              <button type="submit">Publish</button>
            </div>
            <p class="gate-error" id="account-error" role="alert"></p>
          </form>
        </div>
      </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- three.js is vendored as a static file, not an npm dependency — see
         public/vendor/README.md. -->
    <script type="importmap">
      { "imports": { "three": "/vendor/three.module.min.js" } }
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
