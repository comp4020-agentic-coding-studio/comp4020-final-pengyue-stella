<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Traces of ANU</title>
    <meta
      name="description"
      content="An immersive shared layer over ANU campus — explore connected scenes, leave a trace, find what others left."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Traces of ANU</h1>
      <p class="tagline">
        Walk through campus. Leave something behind. Find what someone else did.
      </p>
      <p class="presence" id="presence" aria-live="polite"></p>
      <p class="whoami" id="whoami"></p>
      <a class="about-link" href="/readme/">What is this?</a>
    </header>

    <main>
      <div
        id="viewport"
        class="viewport"
        tabindex="0"
        role="application"
        aria-label="Campus scene. Drag, swipe, or use the left and right arrow keys to look around. Press Enter on empty ground to leave a trace."
      >
        <!-- Depth-parallax rendering (currently only Kambri Lawn — see
             docs/adr/0002-kambri-depth-parallax.md) draws into #depth-host
             instead of the flat #scene-image, with its own pins host
             (#depth-pins) positioned in plain viewport pixels rather than
             riding #panorama's translateX — a depth scene's "panning" is
             the virtual camera moving, not the image sliding, so pins for
             it must not inherit that transform. Both default hidden;
             goToScene shows exactly one of the two pin hosts depending on
             whether a depth scene is active for the current scene. -->
        <div id="depth-host" class="depth-host" hidden></div>
        <div id="depth-pins" class="pins" hidden></div>
        <div id="panorama" class="panorama">
          <img id="scene-image" alt="" draggable="false" />
          <div id="pins" class="pins"></div>
        </div>
        <div class="scene-caption">
          <h2 id="scene-title">&nbsp;</h2>
          <p id="scene-blurb">&nbsp;</p>
        </div>
        <button class="pan-btn pan-left" type="button" aria-label="Look left">&#8592;</button>
        <button class="pan-btn pan-right" type="button" aria-label="Look right">&#8594;</button>
      </div>

      <p class="hint">
        Drag to look around &middot; click empty ground to leave a trace &middot; click a mark to
        read it
      </p>

      <nav class="jump-nav" aria-label="Jump to a scene">
        <span class="jump-label">Scenes:</span>
        <div id="jump-buttons"></div>
      </nav>
    </main>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- three.js is vendored as a static file, not an npm dependency — see
         public/vendor/README.md and docs/adr/0002-kambri-depth-parallax.md.
         Only fetched when depth-scene.js is dynamically imported, which
         only happens on a scene whose config carries a `depth` field. -->
    <script type="importmap">
      { "imports": { "three": "/vendor/three.module.min.js" } }
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
